# MoveIt simple controller manager -> ros2_control controllers in config/controllers.yaml.
trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5  # s
  allowed_start_tolerance: 0.01  # rad
  execution_duration_monitoring: true

moveit_manage_controllers: false
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - joint_trajectory_controller
    - gripper_controller

  joint_trajectory_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

  # gripper_right_finger_joint is a mimic joint and is not commanded.
  gripper_controller:
    action_ns: gripper_cmd
    type: GripperCommand
    default: true
    max_effort: 50.0  # N, sent when the trajectory carries no effort
    joints:
      - gripper_left_finger_joint
