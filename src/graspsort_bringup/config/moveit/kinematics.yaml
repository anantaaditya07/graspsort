# IK solver per planning group (loaded as robot_description_kinematics).
# KDL is used because ur_kinematics (analytic UR IK) is not installed here; same values as
# /opt/ros/humble/share/ur_moveit_config/config/kinematics.yaml (ur_moveit_config 2.14).
ur_manipulator:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005  # rad
  kinematics_solver_timeout: 0.005  # s
  kinematics_solver_attempts: 3
