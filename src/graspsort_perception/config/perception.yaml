# GraspSort perception parameters (architecture 7.1). Defaults equal the node's declared defaults.
#
# object_detector_node.model_path is not set here: the node default is the absolute path of the
# repo's models/yolov8n.onnx, baked in at build time (CMake GRASPSORT_DEFAULT_MODEL_PATH). Produce it
# with scripts/export_yolo.py (D-08). Override with --ros-args -p model_path:=... if needed.
object_detector_node:
  ros__parameters:
    conf_threshold: 0.35          # D-04 pass rule
    iou_threshold: 0.45           # NMS IoU
    input_size: 640               # must match the ONNX input
    class_filter: ["bottle", "sports ball"]  # D-04/D-13: COCO class names, no cup
    use_cuda: false
    publish_annotated: true       # detections/image, only when someone subscribes
    intra_op_num_threads: 4
    image_qos_depth: 1            # newest-frame buffer; SensorData QoS
    detections_qos_depth: 5
    metrics_period: 5.0           # s between /metrics messages
    metrics_window: 200           # samples in the rolling p50/p95 window
